name: Update contribution skyline

# Rebuilds the animated 3D contribution skyline from your real GitHub data.
# Runs daily, on demand, and whenever the generator or this workflow changes.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-skyline.yml"

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data (no token needed)
        env:
          GH_PROFILE_USER: Luisssantos56
        run: python scripts/fetch_contributions.py

      - name: Render skyline SVGs (light + dark)
        run: python scripts/render_skyline_svg.py

      - name: Commit updated skyline
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution skyline [skip ci]"
          file_pattern: "data/contributions.json skyline-light.svg skyline-dark.svg"
