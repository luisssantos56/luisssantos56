name: Update contribution skyline

# Rebuilds the animated 3D contribution skyline for the current calendar year,
# matching the profile's "N contributions in YYYY" panel.
# Runs every 3 hours, on demand, and whenever the generator or this workflow changes.
#
# Optional secret CONTRIB_TOKEN (a personal access token with `read:user`):
# when present the data is fetched as the profile owner, which includes private
# contributions exactly like the owner's own profile view. Without it the public
# view is used.

"on":
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-skyline.yml"

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data for the year
        env:
          GH_PROFILE_USER: Luisssantos56
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render skyline SVGs (light + dark)
        run: python scripts/render_skyline_svg.py

      - name: Commit updated skyline
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution skyline [skip ci]"
          file_pattern: "data/contributions.json skyline-light.svg skyline-dark.svg"
